<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot RAG</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        #chat-container { width: 100%; max-width: 700px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background-color: #f1f3f5; color: #333; border-bottom-left-radius: 2px; }
        .sources { font-size: 0.85em; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ddd; color: #555; }
        .source-item { background: #fff; padding: 8px; border-radius: 6px; margin-top: 8px; border: 1px solid #e1e1e1; }
        #input-container { display: flex; padding: 15px; border-top: 1px solid #eee; background: #fafafa; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; outline: none; font-size: 15px; }
        input:focus { border-color: #007bff; }
        button { background-color: #007bff; color: white; font-weight: bold; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="messages">
        <div class="msg bot">Bonjour ! Pose-moi une question, je vais fouiller dans la base vectorielle.</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Pose ta question ici..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const question = inputField.value.trim();
        if (!question) return;

        addMessage(question, "user");
        inputField.value = "";

        try {
            // Requête vers ton API locale Python
            const response = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });
            
            const data = await response.json();
            
            // Formatage des sources renvoyées par le Retriever
            let sourcesHtml = "";
            if (data.sources && data.sources.length > 0) {
                sourcesHtml = "<div class='sources'><strong>📚 Sources retrouvées :</strong><br>";
                data.sources.forEach(src => {
                    sourcesHtml += `<div class='source-item'>📄 <em>${src.source}</em><br>${src.content}</div>`;
                });
                sourcesHtml += "</div>";
            }

            addMessage(data.answer + sourcesHtml, "bot");

        } catch (error) {
            addMessage("Erreur : Impossible de contacter l'API. Ton serveur api.py est-il lancé ?", "bot");
        }
    }

    function addMessage(text, sender) {
        const messagesDiv = document.getElementById("messages");
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerHTML = text; // Permet d'injecter le HTML des sources
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
